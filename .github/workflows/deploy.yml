name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::100514069706:role/github-deploy"
          aws-region: us-east-1
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        run: |
          docker build -t $ECR_REGISTRY/design-system:$GITHUB_SHA . && docker push $ECR_REGISTRY/design-system:$GITHUB_SHA
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build-image]
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::100514069706:role/github-deploy"
          aws-region: us-east-1
      - name: Deploy to staging
        run: |
          helm upgrade --install design-system charts/design-system --set image.tag=$GITHUB_SHA --wait --timeout 10m -n staging
      - name: Smoke test
        env:
          SMOKE_TEST_TOKEN: ${{ secrets.SMOKE_TEST_TOKEN }}
        run: |
          curl -fsS -H "Authorization: Bearer $SMOKE_TEST_TOKEN" https://design-system.staging.internal/healthz
  deploy-production:
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::100514069706:role/github-deploy"
          aws-region: us-east-1
      - name: Deploy to production
        run: |
          helm upgrade --install design-system charts/design-system --set image.tag=$GITHUB_SHA --wait --timeout 10m -n production
      - name: Create Sentry release
        uses: getsentry/action-release@v1
        with:
          environment: production
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: aurelis-digital
          SENTRY_PROJECT: design-system
